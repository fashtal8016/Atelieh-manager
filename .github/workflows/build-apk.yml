
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          pwd
          ls -la
          test -f project.zip || {
            echo "ERROR: project.zip not found in repository root"
            exit 1
          }
          unzip -t project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q project.zip -d extracted
          find extracted -type f -name gradlew

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -type f -name '*.apk' -print -quit | grep -q .; then
            echo "ERROR: Build finished but APK was not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
